# The platform to build and run against. It also decides the plugin's since-build
# floor, so this is the only place the platform version is stated.
platformVersion=2026.2

# ServerpodDartSupport calls Dart SDK APIs directly. Update this only after a
# clean verifier run against the baseline and recommended IDEs.
dartPluginVersion=508.1.0

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.caching=true
org.gradle.parallel=true

# The IntelliJ Platform bundles its own Kotlin stdlib; bundling another copy
# causes classloader conflicts at runtime.
kotlin.stdlib.default.dependency=false
