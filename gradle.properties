# The platform to build and run against. It also decides the plugin's since-build
# floor and which Dart and Flutter releases are resolved, so this is the only
# place the version is stated.
platformVersion=2026.2

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.caching=true
org.gradle.parallel=true

# The IntelliJ Platform bundles its own Kotlin stdlib; bundling another copy
# causes classloader conflicts at runtime.
kotlin.stdlib.default.dependency=false
